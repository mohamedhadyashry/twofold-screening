<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twofold Screening</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky top bar with tabs; screening is a two-pane reader (record list | abstract), stacking on phones. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --sunk: #e8ecf0; --line: #d3dae1;
  --fg: #18222d; --muted: #5b6977; --accent: #2b5c8a; --accent-ink: #ffffff;
  --inc: #23784a; --inc-soft: #dcefe3; --exc: #b2412f; --exc-soft: #f6e0db;
  --may: #9a6a10; --may-soft: #f5ead3; --hl-inc: #c9ecd5; --hl-exc: #f7d3cb;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171d; --surface: #19212a; --sunk: #0d1318; --line: #2b3742;
  --fg: #e3e9ef; --muted: #93a2b0; --accent: #7fb0de; --accent-ink: #0d1318;
  --inc: #6cc795; --inc-soft: #183626; --exc: #f08a78; --exc-soft: #3d1f1a;
  --may: #e3b75c; --may-soft: #3a2e14; --hl-inc: #1f4a33; --hl-exc: #552a22;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19212a; --sunk: #0d1318; --line: #2b3742;
  --fg: #e3e9ef; --muted: #93a2b0; --accent: #7fb0de; --accent-ink: #0d1318;
  --inc: #6cc795; --inc-soft: #183626; --exc: #f08a78; --exc-soft: #3d1f1a;
  --may: #e3b75c; --may-soft: #3a2e14; --hl-inc: #1f4a33; --hl-exc: #552a22;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font: 600 20px/1.3 var(--sans); }
h3 { font: 600 15px/1.3 var(--sans); }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font: 500 11px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 600 17px/1 var(--serif); letter-spacing: .01em; }
.brand .proj { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
nav.tabs button { border: 0; background: none; color: var(--muted); font: 500 14px var(--sans); padding: 7px 11px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
nav.tabs button:hover { color: var(--fg); background: var(--sunk); }
nav.tabs button[aria-selected="true"] { color: var(--fg); background: var(--sunk); box-shadow: inset 0 -2px 0 var(--accent); }
.count { font: 500 11px/1 var(--mono); background: var(--line); color: var(--fg); border-radius: 9px; padding: 3px 6px; }
.count.warn { background: var(--may-soft); color: var(--may); }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.who .name { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

main { padding-block: 20px 60px; }
section.view { display: grid; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start; }

button, .btn { font: 500 14px var(--sans); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { border-color: var(--muted); }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.danger { color: var(--exc); }
button.link { border: 0; background: none; padding: 2px 4px; color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="email"], input[type="search"], input[type="number"], select, textarea { font: 14px var(--sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
input[type="number"] { width: 80px; }
textarea { width: 100%; resize: vertical; }
.btn { position: relative; }
.btn input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }
kbd { font: 500 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }
label.check { display: inline-flex; gap: 6px; align-items: center; }

.dropzone { border: 2px dashed var(--line); border-radius: 8px; padding: 22px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.dropzone.over { border-color: var(--accent); background: var(--sunk); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--sunk); font-weight: 500; white-space: nowrap; }
td.clip { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.maprow { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.maprow label { display: grid; gap: 4px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--surface); }
.stat .n { font: 500 22px/1.2 var(--mono); font-variant-numeric: tabular-nums; }

.pill { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/1 var(--sans); padding: 4px 8px; border-radius: 10px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.include { background: var(--inc-soft); color: var(--inc); }
.pill.exclude { background: var(--exc-soft); color: var(--exc); }
.pill.maybe { background: var(--may-soft); color: var(--may); }
.pill.lead { background: var(--accent); color: var(--accent-ink); }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; display: flex; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* Home */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { text-align: left; display: grid; gap: 8px; padding: 14px; border-radius: 8px; align-content: start; }
.card .t { font: 600 16px/1.3 var(--serif); }
.signin { max-width: 520px; margin: 40px auto; text-align: center; justify-items: center; }
.signin h1 { font: 600 30px/1.2 var(--serif); }

/* Screening */
.screen { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
.listpane { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: grid; gap: 8px; max-height: calc(100vh - 100px); min-width: 0; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.filters button { padding: 4px 8px; font-size: 12px; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.reclist { overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 120px; }
.reclist button { display: grid; grid-template-columns: 10px 1fr; gap: 9px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 9px 11px; background: none; font-weight: 400; }
.reclist button:hover { background: var(--sunk); }
.reclist button.cur { background: var(--sunk); box-shadow: inset 3px 0 0 var(--accent); }
.reclist .t { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.reclist .s { font-size: 12px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; border: 1.5px solid var(--line); }
.dot.include { background: var(--inc); border-color: var(--inc); }
.dot.exclude { background: var(--exc); border-color: var(--exc); }
.dot.maybe { background: var(--may); border-color: var(--may); }
.progress { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; display: flex; }
.progress i { display: block; height: 100%; }
.reader { display: grid; gap: 16px; min-width: 0; }
.reader .rtitle { font: 600 22px/1.3 var(--serif); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 13px; }
.meta a { color: var(--accent); }
.abstract { font: 17px/1.65 var(--serif); max-width: 72ch; white-space: pre-wrap; overflow-wrap: anywhere; }
.abstract.none { font-style: italic; color: var(--muted); }
mark.i { background: var(--hl-inc); color: inherit; border-radius: 2px; padding: 0 1px; }
mark.e { background: var(--hl-exc); color: inherit; border-radius: 2px; padding: 0 1px; }
.decide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.decide button { justify-content: center; padding: 12px; font-size: 15px; font-weight: 600; }
.decide .inc { color: var(--inc); border-color: var(--inc); }
.decide .exc { color: var(--exc); border-color: var(--exc); }
.decide .may { color: var(--may); border-color: var(--may); }
.decide .inc.on { background: var(--inc); color: var(--surface); }
.decide .exc.on { background: var(--exc); color: var(--surface); }
.decide .may.on { background: var(--may); color: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font-size: 12px; padding: 4px 9px; border-radius: 12px; }
.chips button[aria-pressed="true"] { background: var(--exc-soft); color: var(--exc); border-color: var(--exc); }
.navrow { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Duplicates */
.group { display: grid; gap: 10px; }
.members { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.member { border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.member.keep { border-color: var(--inc); box-shadow: inset 0 3px 0 var(--inc); }
.member.dup { opacity: .75; border-style: dashed; }
.member .mt { font: 600 14px/1.35 var(--serif); overflow-wrap: anywhere; }
.member .ab { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 12px; }
.seg button[aria-pressed="true"].k { background: var(--inc); color: var(--surface); }
.seg button[aria-pressed="true"].d { background: var(--exc); color: var(--surface); }

/* Compare */
.conf { display: grid; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.conf:last-child { border-bottom: 0; }
.conf .ct { font: 600 15px/1.35 var(--serif); }
.conf details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.votes { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
.finbtn.on-include { background: var(--inc); border-color: var(--inc); color: var(--surface); }
.finbtn.on-exclude { background: var(--exc); border-color: var(--exc); color: var(--surface); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 6px; z-index: 20; font-size: 14px; max-width: calc(100% - 32px); }
.confirm { border: 1px solid var(--exc); background: var(--exc-soft); border-radius: 6px; padding: 12px; display: grid; gap: 8px; }
.note { border: 1px solid var(--may); background: var(--may-soft); border-radius: 6px; padding: 10px 12px; }
.empty { text-align: center; padding: 40px 16px; display: grid; gap: 12px; justify-items: center; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.copybox { display: flex; gap: 6px; min-width: 0; }
.copybox input { flex: 1; font-family: var(--mono); font-size: 12px; }

@media (max-width: 760px) {
  .screen { grid-template-columns: 1fr; }
  .listpane { position: static; max-height: none; }
  .reclist { max-height: 240px; }
  .who { margin-left: 0; }
  .reader .rtitle { font-size: 19px; }
  .abstract { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>Twofold</b><span class="proj" id="projName"></span></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="who" id="who"></div>
  </div>
</header>
<main class="wrap" id="main"><div class="panel empty"><p class="muted">Loading…</p></div></main>
<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script>
"use strict";
const CONFIG = window.FIREBASE_CONFIG || null;
const DEFAULT_REASONS = ["Wrong population", "Wrong intervention", "Wrong comparator", "Wrong outcome", "Wrong study design", "Wrong publication type", "Not in English", "No abstract / insufficient info", "Other"];
const DEFAULT_KW = { inc: ["randomized", "randomised", "controlled trial", "cohort", "case-control"], exc: ["review", "case report", "mice", "rats", "animal", "in vitro", "protocol"] };
const PART_BYTES = 700000; // stay well under Firestore's 1 MiB document limit

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function toast(msg, ms) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms || 2800); }
function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }
function normTitle(t) { return (t || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/<[^>]+>/g, " ").replace(/[^a-z0-9]+/g, " ").trim(); }
function normDoi(d) { return (d || "").toLowerCase().trim().replace(/^https?:\/\/(dx\.)?doi\.org\//, "").replace(/^doi:\s*/, "").trim(); }
function yearOf(s) { const m = String(s || "").match(/\b(1[89]\d{2}|20\d{2})\b/); return m ? m[1] : ""; }
function shortAuthors(a) { if (!a) return ""; const parts = a.split(/;|\s+and\s+|\|/).map(x => x.trim()).filter(Boolean); return parts.length > 2 ? parts[0] + " et al." : parts.join("; "); }
function plural(n, w, p) { return n + " " + (n === 1 ? w : (p || w + "s")); }
function slug(s) { return (s || "review").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "review"; }
function readFile(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsText(file); }); }
function bytes(o) { return new TextEncoder().encode(JSON.stringify(o)).length; }
function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function saveFile(filename, text) {
  const url = URL.createObjectURL(new Blob([text], { type: filename.endsWith(".csv") ? "text/csv" : "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function packParts(records) {
  const parts = []; let cur = [], size = 0;
  for (const r of records) { const s = bytes(r) + 2; if (cur.length && size + s > PART_BYTES) { parts.push(cur); cur = []; size = 0; } cur.push(r); size += s; }
  if (cur.length) parts.push(cur);
  return parts;
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const nl = text.indexOf("\n"); const first = nl > 0 ? text.slice(0, nl) : text;
  const delim = [",", ";", "\t"].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"' && f === "") q = true;
    else if (c === delim) { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
/* RIS (Cochrane, Embase, Ovid, Web of Science, Zotero, EndNote) and PubMed/MEDLINE .txt/.nbib files
   become the same table a CSV gives, with columns named after the fields so they map by themselves. */
const TAG_HEADER = ["title", "abstract", "authors", "year", "journal", "doi", "pmid", "keywords", "url"];
function tagsToRows(records, pick) {
  return [TAG_HEADER].concat(records.map(pick).filter(r => r.title || r.abstract).map(r => TAG_HEADER.map(k => r[k] || "")));
}
function first(rec, ...tags) { for (const t of tags) if (rec[t] && rec[t].length) return rec[t][0]; return ""; }
function all(rec, ...tags) { for (const t of tags) if (rec[t] && rec[t].length) return rec[t]; return []; }
function parseRIS(text) {
  const recs = []; let cur = null, last = null;
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(/^([A-Z][A-Z0-9])\s{1,2}-(?: (.*))?$/);
    if (m) {
      const [, tag, val = ""] = m;
      if (tag === "TY") { cur = {}; recs.push(cur); }
      if (!cur) continue;
      if (tag === "ER") { cur = null; last = null; continue; }
      (cur[tag] = cur[tag] || []).push(val.trim()); last = tag;
    } else if (cur && last && line.trim()) { const a = cur[last]; a[a.length - 1] += " " + line.trim(); }
  }
  return tagsToRows(recs, r => {
    const an = first(r, "AN"), pm = an.match(/^(?:PUBMED\s*)?(\d{5,9})$/i);
    const doi = first(r, "DO") || (all(r, "UR", "L3").find(u => /doi\.org\//i.test(u)) || "");
    return { title: first(r, "TI", "T1", "CT", "BT"), abstract: all(r, "AB", "N2").join(" "), authors: all(r, "AU", "A1", "A2").join("; "),
      year: first(r, "PY", "Y1", "DA", "Y2"), journal: first(r, "T2", "JO", "JF", "JA", "J2", "T3"), doi, pmid: pm ? pm[1] : "",
      keywords: all(r, "KW").join("; "), url: first(r, "UR", "L2") };
  });
}
function parseMedline(text) {
  const recs = []; let cur = null, last = null;
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(/^([A-Z]{2,4})\s*- (.*)$/);
    if (m) {
      const [, tag, val] = m;
      if (tag === "PMID" || !cur) { cur = {}; recs.push(cur); }
      (cur[tag] = cur[tag] || []).push(val.trim()); last = tag;
    } else if (cur && last && /^\s{2,}\S/.test(line)) { const a = cur[last]; a[a.length - 1] += " " + line.trim(); }
  }
  return tagsToRows(recs, r => {
    const doi = [...all(r, "LID"), ...all(r, "AID")].map(x => x.match(/^(\S+)\s*\[doi\]/)).find(Boolean);
    const pmid = first(r, "PMID");
    return { title: first(r, "TI", "BTI"), abstract: all(r, "AB").join(" "), authors: all(r, "FAU", "AU").join("; "), year: first(r, "DP"),

      <div class="row spread"><div class="row">${[...new Set(g.pairs.map(reasonText))].map(r => `<span class="pill ${g.exact ? "exclude" : "maybe"}">${esc(r)}</span>`).join("")}<span class="muted">${g.ids.length} records</span></div>
      <div class="row"><button class="primary" data-act="resolve" data-g="${gi}">Remove marked duplicates</button><button data-act="notdup" data-g="${gi}">Not duplicates</button></div></div>
      <div class="members">${g.ids.map(id => { const r = byId.get(id); const c = choice[id]; return `<div class="member ${c === "drop" ? "dup" : "keep"}">
        <div class="row spread"><span class="label">${esc(r.source || "")}</span>
        <span class="seg"><button class="k" aria-pressed="${c === "keep"}" data-act="set" data-g="${gi}" data-id="${id}" data-v="keep">Keep</button><button class="d" aria-pressed="${c === "drop"}" data-act="set" data-g="${gi}" data-id="${id}" data-v="drop">Duplicate</button></span></div>
        <div class="mt">${esc(r.title || "(no title)")}</div>
        <div class="meta">${r.authors ? `<span>${esc(shortAuthors(r.authors))}</span>` : ""}${r.year ? `<span class="mono">${esc(r.year)}</span>` : ""}${r.journal ? `<span>${esc(r.journal)}</span>` : ""}${r.doi ? `<span class="mono">${esc(r.doi)}</span>` : ""}</div>
        <div class="ab">${esc(r.abstract || "No abstract")}</div></div>`; }).join("")}</div></div>`;
  }).join("")}
  ${groups.length > 60 ? `<p class="muted">Showing the first 60 groups. Resolve these to see more.</p>` : ""}
  ${D.dupHistory.length ? `<div class="panel"><h3>Decisions made</h3><div class="tablewrap"><table><thead><tr><th>Kept</th><th>Removed</th><th></th></tr></thead><tbody>
    ${D.dupHistory.map((a, i) => ({ a, i })).reverse().slice(0, 200).map(({ a, i }) => { const r = byId.get(a.keep); return `<tr><td class="clip">${esc(r ? r.title : a.keep)}</td><td class="mono">${a.removed.length ? a.removed.length + " removed" : "kept all (not duplicates)"}</td><td><button data-act="undo" data-i="${i}">Undo</button></td></tr>`; }).join("")}
  </tbody></table></div></div>` : ""}`;
  v.onclick = ev => {
    const b = ev.target.closest("button[data-act]"); if (!b) return; const g = groups[+b.dataset.g];
    if (b.dataset.act === "set") { dupChoice[groupKey(g)][b.dataset.id] = b.dataset.v; render(); return; }
    if (b.dataset.act === "resolve") { if (resolveGroup(g, dupChoice[groupKey(g)])) { saveDups(); render(); } return; }
    if (b.dataset.act === "notdup") { const c = {}; g.ids.forEach(id => c[id] = "keep"); resolveGroup(g, c); saveDups(); render(); return; }

  };
  const ae = $("#autoExact"); if (ae) ae.onclick = () => { let n = 0; for (const g of exact) { n += g.ids.length - 1; resolveGroup(g, defaultChoice(g)); } saveDups(); render(); toast(`Removed ${plural(n, "duplicate")}.`); };
  $("#rescan").onclick = () => { detectDuplicates(); dupChoice = {}; saveDups(); render(); toast("Scan finished."); };
}

/* Screening (everyone) */
function screenList() {
  const f = ui.filter; const q = ui.search.trim().toLowerCase();
  return MY.filter(r => {
    const d = DEC[r.id];
    if (f === "todo" && d) return false;
    if (["include", "exclude", "maybe"].includes(f) && (!d || d.d !== f)) return false;
    if (q && !((r.title + " " + r.abstract + " " + r.authors).toLowerCase().includes(q))) return false;
    return true;
  });
}
function renderScreen(v) {
  if (!MY.length) {

  const done = counts.include + counts.exclude + counts.maybe;
  const list = screenList();
  let cur = myById.get(ui.cur);
  if (!cur) { cur = list[0] || MY.find(r => !DEC[r.id]) || MY[0]; ui.cur = cur.id; }
  const d = DEC[cur.id];
  const pct = n => (100 * n / MY.length).toFixed(2) + "%";
  const fbtn = (k, label, n) => `<button data-f="${k}" aria-pressed="${ui.filter === k}">${label}${n != null ? ` <span class="mono">${n}</span>` : ""}</button>`;
  const pos = list.findIndex(r => r.id === cur.id);
  const reasons = P.reasons || DEFAULT_REASONS;
  v.innerHTML = `
  <div class="screen">
    <aside class="listpane">

      <div class="progress" aria-hidden="true"><i style="width:${pct(counts.include)};background:var(--inc)"></i><i style="width:${pct(counts.maybe)};background:var(--may)"></i><i style="width:${pct(counts.exclude)};background:var(--exc)"></i></div>
      <div class="filters">${fbtn("todo", "To do", MY.length - done)}${fbtn("include", "Included", counts.include)}${fbtn("maybe", "Maybe", counts.maybe)}${fbtn("exclude", "Excluded", counts.exclude)}${fbtn("all", "All")}</div>
      <input type="search" id="search" placeholder="Search titles, abstracts, authors" value="${esc(ui.search)}" aria-label="Search your papers">

      ${list.length > ui.listLimit ? `<button id="more" style="justify-content:center">Show ${Math.min(200, list.length - ui.listLimit)} more</button>` : ""}</div>

      <p class="muted small"><kbd>I</kbd> include · <kbd>E</kbd> exclude · <kbd>M</kbd> maybe · <kbd>U</kbd> clear · <kbd>J</kbd>/<kbd>→</kbd> next · <kbd>K</kbd>/<kbd>←</kbd> previous. Saved automatically.</p>

  v.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { ui.filter = b.dataset.f; ui.listLimit = 200; render(); });
  const s = $("#search"); s.oninput = () => { ui.search = s.value; ui.listLimit = 200; render(); const n = $("#search"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  $("#reclist").onclick = ev => { const b = ev.target.closest("button[data-id]"); if (b) { ui.cur = b.dataset.id; render(); } };
  const more = $("#more"); if (more) more.onclick = ev => { ev.stopPropagation(); ui.listLimit += 200; render(); };
  $("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
  v.querySelectorAll("[data-d]").forEach(b => b.onclick = () => choose(b.dataset.d));
  v.querySelectorAll("[data-reason]").forEach(b => b.onclick = () => { const dd = Object.assign({}, DEC[cur.id]); dd.reason = dd.reason === b.dataset.reason ? "" : b.dataset.reason; setDecision(cur.id, dd); render(); });
  const note = $("#note"); if (note) note.onchange = () => setDecision(cur.id, Object.assign({}, DEC[cur.id], { note: note.value }));
  const clr = $("#clear"); if (clr) clr.onclick = () => { setDecision(cur.id, null); render(); };
  const curBtn = $("#reclist .cur"); if (curBtn) curBtn.scrollIntoView({ block: "nearest" });
}
let excludeNext = null; // after Exclude we stay so a reason can be picked; Next or the next decision moves on
function step(dir) {
  if (excludeNext && dir > 0 && ui.filter !== "all") { ui.cur = excludeNext; excludeNext = null; render(); return; }
  excludeNext = null;
  const list = screenList(); if (!list.length) return;
  let i = list.findIndex(r => r.id === ui.cur); i = i < 0 ? 0 : Math.min(list.length - 1, Math.max(0, i + dir));
  ui.cur = list[i].id; render();
}
function choose(dec) {
  const id = ui.cur; const prev = DEC[id]; if (!myById.has(id)) return;
  if (prev && prev.d === dec) return;
  const i = MY.findIndex(r => r.id === id); let next = null;
  for (let k = 1; k <= MY.length; k++) { const r = MY[(i + k) % MY.length]; if (!DEC[r.id] && r.id !== id) { next = r.id; break; } }
  setDecision(id, { d: dec, reason: "", note: (prev && prev.note) || "", at: new Date().toISOString() });
  excludeNext = null;
  if (dec === "exclude") excludeNext = next; else if (next && ui.filter !== "all") ui.cur = next;
  render();
}
document.addEventListener("keydown", ev => {
  if (!P || ui.tab !== "screen" || !MY.length || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const t = ev.target; if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const k = ev.key.toLowerCase();
  if (k === "i") choose("include"); else if (k === "e") choose("exclude"); else if (k === "m") choose("maybe");
  else if (k === "u") { setDecision(ui.cur, null); render(); }
  else if (k === "j" || ev.key === "ArrowRight") step(1);
  else if (k === "k" || ev.key === "ArrowLeft") step(-1);
  else return;
  ev.preventDefault();
});

/* Compare (lead) */
function renderCompare(v) {
  const memberByEmail = {}; Object.values(P.members || {}).forEach(m => memberByEmail[m.email] = m);
  const progress = `<div class="tablewrap"><table><thead><tr><th>Reviewer</th><th>Progress</th></tr></thead><tbody>
    ${Object.entries(P.assignCounts || {}).map(([e, n]) => { const m = memberByEmail[e]; const done = m && m.total ? m.done || 0 : 0; return `<tr><td>${esc(m ? m.name : e)}</td><td><div class="row"><span class="bar" style="width:120px"><i style="width:${(100 * done / n).toFixed(1)}%"></i></span><span class="mono small">${done}/${n}</span></div></td></tr>`; }).join("") || `<tr><td colspan="2" class="muted">No papers assigned yet.</td></tr>`}
  </tbody></table></div>`;
  if (P.blind !== false) {
    v.innerHTML = `<div class="panel"><div><h2>Compare reviewers</h2><p class="muted">Blind mode is on: nobody, including you, can see anyone else's decisions. Turn it off once everyone has finished to see agreement and conflicts.</p></div>
      ${progress}<div id="revealArea"><button class="primary" id="revealBtn">Turn blind mode off and compare</button></div></div>`;
    $("#revealBtn").onclick = () => {
      $("#revealArea").innerHTML = `<div class="confirm"><p>Reveal decisions? You will see every reviewer's decisions. Reviewers still only see their own. You can turn blind mode back on.</p><div class="row"><button class="primary" id="revYes">Reveal</button><button id="revNo">Cancel</button></div></div>`;
      $("#revYes").onclick = () => saveProject({ blind: false }); $("#revNo").onclick = render;
    };
    return;
  }
  const c = compareData();
  if (!c) { v.innerHTML = `<div class="panel empty"><h3>Nothing to compare yet</h3><p class="muted">Assign papers on the Team tab first.</p></div>`; return; }
  const finInc = c.rows.filter(x => x.fin === "include").length, finExc = c.rows.filter(x => x.fin === "exclude").length;
  const f = ui.cmpFilter;
  const shown = c.rows.filter(x => f === "open" ? c.open.includes(x) : f === "resolved" ? FINAL[x.r.id] : f === "agree" ? x.status === "agree" : f === "pending" ? x.status === "pending" : true);
  const pos = A ? new Map(A.order.map((id, i) => [id, i + 1])) : new Map();
  v.innerHTML = `
  <div class="panel">
    <div class="row spread"><div><h2>Compare reviewers</h2><p class="muted">Blind mode is off. You see everyone's decisions; reviewers see only their own.</p></div><button id="blindBtn">Turn blind mode back on</button></div>
    <div class="stats">
      <div class="stat"><div class="label">Screened by all their reviewers</div><div class="n">${c.full}/${c.rows.length}</div></div>
      <div class="stat"><div class="label">Agreement</div><div class="n">${c.full ? (c.agree * 100).toFixed(1) + "%" : "–"}</div></div>
      <div class="stat"><div class="label">Need your decision</div><div class="n" style="color:var(--may)">${c.open.length}</div></div>
      <div class="stat"><div class="label">Final include / exclude</div><div class="n"><span style="color:var(--inc)">${finInc}</span> / <span style="color:var(--exc)">${finExc}</span></div></div>
    </div>
    ${c.pairs.length ? `<div class="tablewrap"><table><thead><tr><th>Reviewer pair</th><th>Papers both screened</th><th>Agreement</th><th>Cohen's κ (3 categories)</th><th>κ include/exclude</th></tr></thead><tbody>
      ${c.pairs.map(p => `<tr><td>${p.key.split("|").map(e => esc(nameOf(e))).join(" + ")}</td><td class="mono">${p.n}</td><td class="mono">${(p.po * 100).toFixed(1)}%</td><td class="mono">${p.k3 == null ? "–" : p.k3.toFixed(2)} <span class="muted">${kappaWord(p.k3)}</span></td><td class="mono">${p.k2 == null ? "–" : p.k2.toFixed(2)} <span class="muted">${kappaWord(p.k2)}</span></td></tr>`).join("")}
    </tbody></table></div><p class="muted small">For κ include/exclude, Maybe counts as Include (the usual convention at title/abstract stage).</p>` : ""}
    <details><summary class="muted" style="cursor:pointer">Reviewer progress</summary><div style="margin-top:8px">${progress}</div></details>
  </div>
  <div class="panel">
    <div class="filters">${[["open", "Need a decision", c.open.length], ["resolved", "Decided by you", c.rows.filter(x => FINAL[x.r.id]).length], ["agree", "Agreed", c.rows.filter(x => x.status === "agree").length], ["pending", "Not finished", c.rows.filter(x => x.status === "pending").length], ["all", "All", c.rows.length]].map(([k, l, n]) => `<button data-cf="${k}" aria-pressed="${f === k}">${l} <span class="mono">${n}</span></button>`).join("")}</div>
    <div>${shown.slice(0, 150).map(x => `<div class="conf">
      <div class="ct">#${pos.get(x.r.id) || "?"} · ${esc(x.r.title || "(no title)")}</div>
      <div class="meta">${esc([shortAuthors(x.r.authors), x.r.year, x.r.journal].filter(Boolean).join(" · "))}</div>
      <div class="votes">${x.votes.map(o => `<span>${esc(nameOf(o.e))}: ${pill(o.v)}${o.v && o.v.reason ? ` <span class="muted">${esc(o.v.reason)}</span>` : ""}${o.v && o.v.note ? ` <span class="muted">“${esc(o.v.note)}”</span>` : ""}</span>`).join("")}</div>
      ${x.r.abstract ? `<details><summary>Abstract</summary><p class="abstract" style="font-size:15px;margin-top:6px">${highlight(x.r.abstract)}</p></details>` : ""}
      <div class="row"><span class="label">Final</span>
        <button class="finbtn ${x.fin === "include" ? "on-include" : ""}" data-fin="include" data-id="${x.r.id}">Include</button>
        <button class="finbtn ${x.fin === "exclude" ? "on-exclude" : ""}" data-fin="exclude" data-id="${x.r.id}">Exclude</button>
        ${FINAL[x.r.id] ? `<button data-fin="" data-id="${x.r.id}">Reset</button>` : ""}
        ${x.fin ? `<span class="muted small">${FINAL[x.r.id] ? "your decision" : "reviewers agreed"}</span>` : ""}</div>
    </div>`).join("") || `<p class="muted">Nothing in this list.</p>`}
    ${shown.length > 150 ? `<p class="muted">Showing 150 of ${shown.length}. Decide some to see more.</p>` : ""}</div>
  </div>`;
  $("#blindBtn").onclick = () => saveProject({ blind: true });
  v.querySelectorAll("[data-cf]").forEach(b => b.onclick = () => { ui.cmpFilter = b.dataset.cf; render(); });
  v.querySelectorAll("[data-fin]").forEach(b => b.onclick = () => { saveFinal(b.dataset.id, b.dataset.fin); render(); });
}

/* Export */
function renderExport(v) {
  const base = slug(P.name);
  const myCSV = () => {
    const reasons = [["paper #", "title", "authors", "year", "journal", "doi", "pmid", "my decision", "reason", "note", "decided at"]];
    for (const r of MY) { const d = DEC[r.id]; reasons.push([r.no, r.title, r.authors, r.year, r.journal, r.doi, r.pmid, d ? d.d : "", d ? d.reason : "", d ? d.note : "", d ? d.at : ""]); }
    return toCSV(reasons);
  };
  if (!isLead()) {
    v.innerHTML = `<div class="panel"><h3>My decisions</h3><p class="muted">Your ${plural(MY.length, "assigned paper")} with your decisions, reasons and notes, as a CSV for Excel or Google Sheets. Your decisions are already saved online; this is only a copy.</p>
      <div><button class="primary" id="exMine" ${MY.length ? "" : "disabled"}>Download my decisions</button></div></div>`;
    $("#exMine").onclick = () => saveFile(base + "-my-decisions.csv", myCSV()); return;
  }
  const act = activeRecords(); const c = P.blind === false ? compareData() : null;
  const finInc = c ? c.rows.filter(x => x.fin === "include").length : 0, finExc = c ? c.rows.filter(x => x.fin === "exclude").length : 0;
  v.innerHTML = `
  <div class="grid2">
    <div class="panel"><h3>Screening results (CSV)</h3>
      <p class="muted">Every paper with who screened it, each decision, reason and note, the agreement status and the final decision.</p>
      ${c ? "" : `<p class="note small">Turn blind mode off on the Compare tab to include everyone's decisions.</p>`}
      <div class="row"><button class="primary" id="exResults" ${act.length ? "" : "disabled"}>Download all results</button><button id="exIncluded" ${finInc ? "" : "disabled"}>Final includes only</button><button id="exDups" ${Object.keys(D.removed).length ? "" : "disabled"}>Removed duplicates</button><button id="exMine" ${MY.length ? "" : "disabled"}>My decisions</button></div></div>
    <div class="panel"><h3>PRISMA numbers</h3>
      <div class="tablewrap"><table><tbody>
        <tr><td>Records identified</td><td class="mono">${R.length}</td></tr>
        ${(P.sources || []).map(s => `<tr><td class="muted">&nbsp;&nbsp;${esc(s.name)}</td><td class="mono muted">${s.count}</td></tr>`).join("")}
        <tr><td>Duplicates removed</td><td class="mono">${Object.keys(D.removed).length}</td></tr>
        <tr><td>Records screened (title/abstract)</td><td class="mono">${act.length}</td></tr>
        <tr><td>Records excluded</td><td class="mono">${c ? finExc : "–"}</td></tr>
        <tr><td>Records sought for full-text retrieval</td><td class="mono">${c ? finInc : "–"}</td></tr>
        ${c ? `<tr><td>Still undecided</td><td class="mono" style="color:var(--may)">${act.length - finInc - finExc}</td></tr>` : ""}
      </tbody></table></div></div>
  </div>`;
  const results = only => {
    const pos = A ? new Map(A.order.map((id, i) => [id, i + 1])) : new Map();
    const rowsById = new Map(c ? c.rows.map(x => [x.r.id, x]) : []);
    const people = [...new Set(Object.values(A ? A.map : {}).flat())];
    const byEmail = {}; Object.values(OTHERS).forEach(o => byEmail[o.email] = o.d); byEmail[me.email] = DEC;
    const header = ["paper #", "id", "title", "authors", "year", "journal", "doi", "pmid", "abstract", "source", "screened by"];
    people.forEach(e => header.push(nameOf(e) + " decision", nameOf(e) + " reason", nameOf(e) + " note"));
    header.push("agreement", "final decision");
    const rows = [header];
    for (const r of act) {
      const x = rowsById.get(r.id); const fin = x ? x.fin || "" : ""; if (only && fin !== "include") continue;
      const es = A && A.map[r.id] || [];
      const row = [pos.get(r.id) || "", r.id, r.title, r.authors, r.year, r.journal, r.doi, r.pmid, r.abstract, r.source, es.map(nameOf).join("; ")];
      people.forEach(e => { const d = es.includes(e) && c ? (byEmail[e] || {})[r.id] : null; row.push(d ? d.d : "", d ? d.reason : "", d ? d.note : ""); });
      row.push(x ? ({ bothmaybe: "all maybe", pending: "not finished" })[x.status] || x.status : "not assigned", fin);
      rows.push(row);
    }
    return toCSV(rows);
  };
  $("#exResults").onclick = () => saveFile(base + "-screening-results.csv", results(false));
  $("#exIncluded").onclick = () => saveFile(base + "-included.csv", results(true));
  $("#exMine").onclick = () => saveFile(base + "-my-decisions.csv", myCSV());
  $("#exDups").onclick = () => { const rows = [["removed id", "title", "authors", "year", "doi", "source", "kept id", "kept title"]]; for (const [id, keep] of Object.entries(D.removed)) { const r = byId.get(id), k = byId.get(keep); if (r) rows.push([id, r.title, r.authors, r.year, r.doi, r.source, keep, k ? k.title : ""]); } saveFile(base + "-duplicates-removed.csv", toCSV(rows)); };
}

window.addEventListener("hashchange", () => { const id = (location.hash.match(/^#p-([\w-]+)$/) || [])[1]; if (me && id && id !== PID) openProject(id); });
render();
boot();
</script>
</body>
</html>
